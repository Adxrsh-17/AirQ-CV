[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airq-astra"
version = "0.0.1"
description = "Read-only forensic satellite data audit for AirQ-Astra"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "rasterio>=1.3", "pyproj>=3.6", "scipy>=1.12", "matplotlib>=3.8", "PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.6"]
export = ["earthengine-api>=1.6,<2", "google-cloud-storage>=3,<4"]
training = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["smoke: fast synthetic Phase 0 tests", "integration: checks retained real-data audit evidence"]

[tool.ruff]
line-length = 110
target-version = "py311"
